services:
  - type: web
    name: plant-disease-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: EAGER_LOAD_MODELS
        value: "false"
      - key: WHISPER_MODEL_SIZE
        value: "tiny"
